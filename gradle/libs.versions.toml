[versions]
agp = "9.4.1"
core = "1.19.1"
junit = "4.13.2"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
swiperefresh = "1.1.0"
retrofit = "2.11.0"
gson = "2.11.0"
okhttp = "4.12.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
